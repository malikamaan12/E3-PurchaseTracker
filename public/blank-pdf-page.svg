<?xml version="1.0" encoding="UTF-8"?>
<svg width="595px" height="842px" viewBox="0 0 595 842" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Blank PDF Page</title>
    <defs>
        <linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="pageGradient">
            <stop stop-color="#f8f9fa" offset="0%"></stop>
            <stop stop-color="#ffffff" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g id="Page" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect fill="url(#pageGradient)" x="0" y="0" width="595" height="842"></rect>
        
        <!-- Grid lines for visual guidance -->
        <g id="GridLines" stroke="#eeeeee" stroke-width="0.5">
            <!-- Vertical grid lines every 50px -->
            <line x1="50" y1="0" x2="50" y2="842"></line>
            <line x1="100" y1="0" x2="100" y2="842"></line>
            <line x1="150" y1="0" x2="150" y2="842"></line>
            <line x1="200" y1="0" x2="200" y2="842"></line>
            <line x1="250" y1="0" x2="250" y2="842"></line>
            <line x1="300" y1="0" x2="300" y2="842"></line>
            <line x1="350" y1="0" x2="350" y2="842"></line>
            <line x1="400" y1="0" x2="400" y2="842"></line>
            <line x1="450" y1="0" x2="450" y2="842"></line>
            <line x1="500" y1="0" x2="500" y2="842"></line>
            <line x1="550" y1="0" x2="550" y2="842"></line>
            
            <!-- Horizontal grid lines every 50px -->
            <line x1="0" y1="50" x2="595" y2="50"></line>
            <line x1="0" y1="100" x2="595" y2="100"></line>
            <line x1="0" y1="150" x2="595" y2="150"></line>
            <line x1="0" y1="200" x2="595" y2="200"></line>
            <line x1="0" y1="250" x2="595" y2="250"></line>
            <line x1="0" y1="300" x2="595" y2="300"></line>
            <line x1="0" y1="350" x2="595" y2="350"></line>
            <line x1="0" y1="400" x2="595" y2="400"></line>
            <line x1="0" y1="450" x2="595" y2="450"></line>
            <line x1="0" y1="500" x2="595" y2="500"></line>
            <line x1="0" y1="550" x2="595" y2="550"></line>
            <line x1="0" y1="600" x2="595" y2="600"></line>
            <line x1="0" y1="650" x2="595" y2="650"></line>
            <line x1="0" y1="700" x2="595" y2="700"></line>
            <line x1="0" y1="750" x2="595" y2="750"></line>
            <line x1="0" y1="800" x2="595" y2="800"></line>
        </g>
        
        <!-- Main content area indicator -->
        <rect id="ContentArea" stroke="#dddddd" stroke-width="1" stroke-dasharray="5,5" x="40" y="120" width="515" height="602"></rect>
        <text font-family="Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle" x="297.5" y="421">
            DOCUMENT CONTENT AREA
        </text>
        
        <!-- Header and footer area indicators -->
        <rect id="HeaderArea" stroke="#dddddd" stroke-width="1" stroke-dasharray="5,5" x="0" y="0" width="595" height="100"></rect>
        <rect id="FooterArea" stroke="#dddddd" stroke-width="1" stroke-dasharray="5,5" x="0" y="780" width="595" height="62"></rect>
    </g>
</svg>