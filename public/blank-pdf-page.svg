<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="595" height="842" xmlns="http://www.w3.org/2000/svg">
  <!-- A4 page background (595 x 842 pixels) -->
  <rect width="595" height="842" fill="white" />
  
  <!-- Light grid for visual reference -->
  <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
  </pattern>
  <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#smallGrid)"/>
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  </pattern>
  <rect width="595" height="842" fill="url(#grid)" />
  
  <!-- Header area placeholder -->
  <rect x="0" y="0" width="595" height="100" fill="#f9fafb" fill-opacity="0.8" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="50" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Header Area</text>
  
  <!-- Footer area placeholder -->
  <rect x="0" y="782" width="595" height="60" fill="#f9fafb" fill-opacity="0.8" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="812" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Footer Area</text>
  
  <!-- Content area sections -->
  <rect x="40" y="120" width="515" height="90" fill="#f9fafb" fill-opacity="0.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="165" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Basic Information</text>
  
  <rect x="40" y="220" width="515" height="90" fill="#f9fafb" fill-opacity="0.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="265" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Requester Details</text>
  
  <rect x="40" y="320" width="515" height="90" fill="#f9fafb" fill-opacity="0.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="365" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Vendor Information</text>
  
  <rect x="40" y="420" width="515" height="150" fill="#f9fafb" fill-opacity="0.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="495" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Purchase Items</text>
  
  <rect x="40" y="580" width="515" height="90" fill="#f9fafb" fill-opacity="0.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="625" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Approval Information</text>
  
  <rect x="40" y="680" width="515" height="90" fill="#f9fafb" fill-opacity="0.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5" />
  <text x="297.5" y="725" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">Attachments & Notes</text>
  
  <!-- Page number placeholder -->
  <text x="545" y="820" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Page 1</text>
</svg>